spring:
  application:
    name: modelDesign-ai
  ai:
    # 统一模型开关：默认关闭，避免未配置 OpenAI 时触发自动装配报错
    model:
      chat: ${model-design.ai.enabled:false}
      embedding: ${model-design.ai.enabled:false}
      image: ${model-design.ai.enabled:false}
      moderation: ${model-design.ai.enabled:false}
      audio:
        speech: ${model-design.ai.enabled:false}
        transcription: ${model-design.ai.enabled:false}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:}
      chat:
        options:
          model: ${MODEL_NAME:MiniMax-M2.7}
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/model_design?sslmode=disable
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
#    dynamic:
#      primary: master
#      strict: false
#      datasource:
#        master:
#          url: jdbc:mysql://127.0.0.1:3306/model_design?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
#          username: root
#          password: root
#          driver-class-name: com.mysql.cj.jdbc.Driver
#        slave:
#          url: jdbc:mysql://127.0.0.1:3306/model_design?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
#          username: root
#          password: root
#          driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      database: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:model-design}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      missing-topics-fatal: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    ignore-migration-patterns: '*:missing'
    locations: classpath:db/migration
    driver-class-name: ${spring.datasource.driver-class-name}
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  servlet:
    multipart:
      max-file-size: ${MODEL_DESIGN_FILE_MAX_FILE_SIZE:20MB}
      max-request-size: ${MODEL_DESIGN_FILE_MAX_REQUEST_SIZE:20MB}
  mvc:
    throw-exception-if-no-handler-found: true

mybatis-plus:
#  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      id-type: auto
      table-underline: false
      column-format: '"%s"'
      table-format: '"%s"'

dromara:
  x-file-storage:
    default-platform: local-plus-1
    thumbnail-suffix: '.thumbnail.jpg'
    local-plus:
      - platform: local-plus-1
        enable-storage: true
        enable-access: false
        domain: ''
        base-path: 'system-file/'
        storage-path: ${MODEL_DESIGN_FILE_STORAGE_PATH:./storage/}

model-design:
  ai:
    # AI 总开关：默认 false，需要时通过环境变量 MODEL_DESIGN_AI_ENABLED=true 开启
    enabled: ${MODEL_DESIGN_AI_ENABLED:false}
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:change-this-jwt-secret-change-this-jwt-secret}
    access-token-expire-seconds: ${AUTH_ACCESS_TOKEN_EXPIRE_SECONDS:${AUTH_TOKEN_EXPIRE_SECONDS:7200}}
    refresh-token-expire-seconds: ${AUTH_REFRESH_TOKEN_EXPIRE_SECONDS:2592000}
    session-key-prefix: ${AUTH_SESSION_KEY_PREFIX:auth:admin:token:}
    login-audit-retention-days: ${AUTH_LOGIN_AUDIT_RETENTION_DAYS:90}
    login-audit-cleanup-cron: ${AUTH_LOGIN_AUDIT_CLEANUP_CRON:0 30 3 * * *}
  qywork:
    base-url: ${QYWORK_BASE_URL:https://qyapi.weixin.qq.com}
    access-token-cache-key-prefix: ${QYWORK_ACCESS_TOKEN_CACHE_KEY_PREFIX:qywork:access-token:}
    access-token-refresh-advance-seconds: ${QYWORK_ACCESS_TOKEN_REFRESH_ADVANCE_SECONDS:300}
  system:
    file:
      storage-path: ${MODEL_DESIGN_FILE_STORAGE_PATH:./storage/}
      thumbnail:
        enabled: ${MODEL_DESIGN_FILE_THUMBNAIL_ENABLED:true}
        width: ${MODEL_DESIGN_FILE_THUMBNAIL_WIDTH:200}
        height: ${MODEL_DESIGN_FILE_THUMBNAIL_HEIGHT:200}
    message:
      kafka:
        push-topic: ${MODEL_DESIGN_SYSTEM_MESSAGE_PUSH_TOPIC:model-design.system-message.push}
        push-dlt-topic: ${MODEL_DESIGN_SYSTEM_MESSAGE_PUSH_DLT_TOPIC:model-design.system-message.push.dlt}
        retry-max-attempts: ${MODEL_DESIGN_SYSTEM_MESSAGE_RETRY_MAX_ATTEMPTS:3}
        retry-backoff-seconds: ${MODEL_DESIGN_SYSTEM_MESSAGE_RETRY_BACKOFF_SECONDS:300}
        republish-interval-seconds: ${MODEL_DESIGN_SYSTEM_MESSAGE_REPUBLISH_INTERVAL_SECONDS:30}
        republish-batch-size: ${MODEL_DESIGN_SYSTEM_MESSAGE_REPUBLISH_BATCH_SIZE:100}

logging:
  level:
    org.springframework.ai: debug
    org.springframework.web.client: debug

server:
  port: 9999

casbin:
  #Whether to enable Casbin, it is enabled by default.
  enableCasbin: true
  #Whether to use thread-synchronized Enforcer, default false
  useSyncedEnforcer: false
  #Whether to use distributed Enforcer, default false.
  #If both useSyncedEnforcer and useDistributedEnforcer are set to true, useDistributedEnforcer will take effect.
  useDistributedEnforcer: false
  #Whether to enable automatic policy saving, if the adapter supports this function, it is enabled by default.
  autoSave: true
  #Storage type [file, jdbc], currently supported jdbc database [mysql (mariadb), h2, oracle, postgresql, db2]
  #Welcome to write and submit the jdbc adapter you are using, see: org.casbin.adapter.OracleAdapter
  #The jdbc adapter will actively look for the data source information you configured in spring.datasource
  #Default use jdbc, and use the built-in h2 database for memory storage
  storeType: jdbc
  #Customized policy table name when use jdbc, casbin_rule as default.
  tableName: casbin_rule
  #Data source initialization policy [create (automatically create data table, no longer initialized if created), never (always do not initialize)]
  initializeSchema: create
  #Local model configuration file address, the default reading location: classpath: casbin/model.conf
  model: classpath:casbin/model.conf
  #If the model configuration file is not found in the default location and casbin.model is not set correctly, the built-in default rbac model is used, which takes effect by default.
  useDefaultModelIfModelNotSetting: true
  #Local policy configuration file address, the default reading location: classpath: casbin/policy.csv
  #If the configuration file is not found in the default location, an exception will be thrown.
  #This configuration item takes effect only when casbin.storeType is set to file.
#  policy: classpath:casbin/policy.csv
  #Whether to enable the CasbinWatcher mechanism, the default is not enabled.
  #If the mechanism is enabled, casbin.storeType must be jdbc, otherwise the configuration is invalid.
  enableWatcher: false
  #CasbinWatcher notification mode, defaults to use Redis for notification synchronization, temporarily only supports Redis
  #After opening Watcher, you need to manually add spring-boot-starter-data-redis dependency.
  watcherType: redis
  #Watcher to support spring tx, the default is not enable.
  #If the mechanism is enabled, When updating policy in a spring transaction, watcher will trigger the update after commit
  watcherTxSupport: false
  exception:
