spring:
  application:
    name: modelDesign-ai
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:}
      chat:
        options:
          model: ${MODEL_NAME:MiniMax-M2.7}
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/model_design?sslmode=disable
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
#    dynamic:
#      primary: master
#      strict: false
#      datasource:
#        master:
#          url: jdbc:mysql://127.0.0.1:3306/model_design?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
#          username: root
#          password: root
#          driver-class-name: com.mysql.cj.jdbc.Driver
#        slave:
#          url: jdbc:mysql://127.0.0.1:3306/model_design?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
#          username: root
#          password: root
#          driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      database: 0
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    driver-class-name: ${spring.datasource.driver-class-name}
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  mvc:
    throw-exception-if-no-handler-found: true

mybatis-plus:
#  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      id-type: auto
      table-underline: false
      column-format: '"%s"'
      table-format: '"%s"'

model-design:
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:change-this-jwt-secret-change-this-jwt-secret}
    token-expire-seconds: ${AUTH_TOKEN_EXPIRE_SECONDS:7200}
    session-key-prefix: ${AUTH_SESSION_KEY_PREFIX:auth:admin:token:}

logging:
  level:
    org.springframework.ai: debug
    org.springframework.web.client: debug

server:
  port: 9999
