services:
  frontend:
    build:
      context: ./admin-rsbuild
      dockerfile: Dockerfile
    container_name: model-design-frontend
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./modelDesign
      dockerfile: Dockerfile
    container_name: model-design-backend
    ports:
      - '${BACKEND_PORT:-9999}:9999'
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      MODEL_NAME: ${MODEL_NAME}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      MODEL_DESIGN_FILE_STORAGE_PATH: ${MODEL_DESIGN_FILE_STORAGE_PATH:-/app/storage}
    volumes:
      - ./docker-data/storage:/app/storage
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
